<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Enhancement Slave Idle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="resetGame">Reset Game</button>

  <div class="game">
    <!-- WC3-style top chips: timers, milestones, hints -->
    <div class="chipBar" id="chipBar"></div>

    <!-- battlefield: the hero area -->
    <div class="mobInfoWrapper panel">
      <canvas id="battleCanvas"></canvas>
      <div class="mobInfo">
        <strong id="mobName"></strong>
        <span>HP <span id="mobHealth"></span></span>
        <span>DEF <span id="mobDefense"></span></span>
        <span>Regen <span id="mobRegen"></span></span>
        <span>💰 <span id="mobCopper"></span></span>
        <span>Kills <span id="mobKills"></span></span>
      </div>
      <button id="huntFieldBoss">⚔ Hunt Field Boss (10× HP · 20× XP · guaranteed bag)</button>
      <span id="fieldKills"></span>
    </div>

    <!-- WC3-style HUD: portrait, name plate, HP, stats, currency, inventory -->
    <div class="hudBar panel">
      <div class="hudPortrait" id="hudPortrait">🧑</div>
      <div class="hudCenter">
        <div class="namePlate" id="hudPlate"></div>
        <div class="hpBarOuter"><div class="hpBarInner" id="hudHpBar"></div><span class="hpText" id="hudHpText"></span></div>
        <div class="hudStats">
          <span title="Damage">⚔ <b id="playerDamage"></b></span>
          <span title="Attack interval (ms)">⏱ <b id="playerAttackSpeed"></b>ms</span>
          <span title="Intelligence">INT <b id="playerInt"></b></span>
          <span title="Experience">XP <b id="playerXP"></b></span>
        </div>
        <div class="hudCurrency">
          <span class="cur curGold" title="Gold (1e9 silver)">● <b id="curGold">0</b></span>
          <span class="cur curSilver" title="Silver (1e9 copper)">● <b id="curSilver">0</b></span>
          <span class="cur curCopper" title="Copper">● <b id="curCopper">0</b></span>
          <span class="cur" id="soulsRow" title="Avatar souls: 100 years old / Brilliant Sarah" style="display:none">✦ <b id="soulsVal"></b></span>
          <span class="cur" id="potionRow" title="Active potions" style="display:none">🧪 <b id="potionVal"></b></span>
          <button id="fmtToggle" title="Toggle number format">1.2M</button>
        </div>
      </div>
      <div class="hudInv" id="hudInv"></div>
    </div>

    <div class="panel">
      <h3>Skills</h3>
      <div class="skillBar"></div>
    </div>

    <!-- tabbed area -->
    <nav class="tabBar">
      <button data-tab="hunt" class="active">Hunt</button>
      <button data-tab="shop">Shop</button>
      <button data-tab="bosses">Bosses</button>
      <button data-tab="gear">Gear</button>
      <button data-tab="jobs">Jobs</button>
      <button data-tab="macro">Macro</button>
      <button data-tab="bestiary">Bestiary</button>
      <button data-tab="legion">Legion</button>
    </nav>

    <div class="tabPanels">
      <div class="tabPanel active" data-panel="hunt">
        <div class="panel"><h3>Hunting Grounds</h3><div class="zoneList"></div></div>
      </div>
      <div class="tabPanel" data-panel="shop">
        <div class="panel"><h3>Shop</h3><div class="shopList"></div></div>
      </div>
      <div class="tabPanel" data-panel="bosses">
        <div class="panel"><h3>Boss Zone</h3><div class="bossList"></div></div>
      </div>
      <div class="tabPanel" data-panel="gear">
        <div class="panel"><h3>Equipment</h3><div class="equipmentList"></div></div>
        <div class="panel"><h3>Enhance Feed</h3>
          <div class="feedFilter">
            <button data-ff="" class="active">All</button>
            <button data-ff="winsOnly">Wins</button>
            <button data-ff="failsOnly">Fails</button>
          </div>
          <div id="feed"></div>
        </div>
      </div>
      <div class="tabPanel" data-panel="jobs">
        <div class="panel"><h3>Odd Jobs</h3><div class="gatheringPanel"></div></div>
      </div>
      <div class="tabPanel" data-panel="macro">
        <div class="panel"><h3>Macro Workshop</h3><div class="macroPanel"></div></div>
      </div>
      <div class="tabPanel" data-panel="bestiary">
        <div class="panel"><h3>Bestiary</h3><div class="bestiaryList"></div></div>
      </div>
      <div class="tabPanel" data-panel="legion">
        <div class="panel"><h3>Legion</h3><div class="legionPanel"></div></div>
      </div>
    </div>
  </div>

  <div id="classSelect">
    <div class="classSelectBox">
      <h2>Choose your class</h2>
      <p>No repick. No refunds. Choose the rest of your life.</p>
      <div class="classList"></div>
    </div>
  </div>

  <div id="offlineModal">
    <div class="classSelectBox">
      <h2>Welcome back</h2>
      <div id="offlineBody"></div>
      <p><button id="offlineDismiss">Back to the grind</button></p>
    </div>
  </div>

<script type="module" src="./main.js"></script>
</body>
</html>
